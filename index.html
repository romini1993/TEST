<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PORTO">
  <link rel="manifest" href="manifest.json">
  <title>PORTO</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --card: #16161f;
      --card2: #1a1a24;
      --border: rgba(255,255,255,0.07);
      --bh: rgba(255,255,255,0.13);
      --text: #f0eff8;
      --muted: #6b6a80;
      --accent: #7c6af7;
      --accent-glow: rgba(124,106,247,0.18);
      --accent-border: rgba(124,106,247,0.4);
      --green: #22d3a0;
      --red: #f05d6e;
      --mono: 'Space Mono', monospace;
      --sans: 'DM Sans', sans-serif;
      --sidebar-w: 280px;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    .app-shell { display: flex; flex-direction: column; min-height: 100vh; }

    .top-bar {
      background: transparent; padding: 10px 16px 4px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing: 0.12em; flex-shrink: 0; }
    .brand span { color: var(--accent); }
    .kurs-badge { font-family: var(--mono); font-size: 10px; color: var(--muted); background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }

    .summary-wrap { position: sticky; top: 0; z-index: 200; background: rgba(10,10,15,0.97); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 0; }
    .summary-card { background: linear-gradient(135deg, #1a1829 0%, #12111c 50%, #0e1420 100%); border: 1px solid var(--accent-border); border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 0 30px rgba(124,106,247,0.08), inset 0 1px 0 rgba(255,255,255,0.06); margin: 8px 16px 0; }
    .summary-left { flex: 1; min-width: 0; }
    .summary-label { font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
    .summary-idr { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--text); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .summary-usd { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 3px; }
    .summary-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .asset-count { font-family: var(--mono); font-size: 10px; color: var(--accent); background: var(--accent-glow); border: 1px solid var(--accent-border); border-radius: 6px; padding: 3px 8px; }

    .controls-wrap { padding: 0 16px 10px; background: rgba(10,10,15,0.95); backdrop-filter: blur(20px); }
    .tab-row { display: flex; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 8px; gap: 4px; }
    .tab-btn { flex: 1; padding: 8px; border: none; border-radius: 8px; background: transparent; color: var(--muted); font-family: var(--sans); font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: var(--accent); color: #fff; }
    .filter-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .filter-input { flex: 1; width: 100%; min-width: 0; box-sizing: border-box; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px; padding: 7px 12px; color: var(--text); font-family: var(--sans); font-size: 13px; outline: none; transition: border-color 0.2s; }
    .filter-input:focus { border-color: var(--accent-border); }
    .filter-input::placeholder { color: var(--muted); }
    .sort-row { display: flex; gap: 6px; }
    .ctrl-select { flex: 1; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-family: var(--sans); font-size: 11px; padding: 6px 8px; outline: none; cursor: pointer; appearance: none; }

    #main-list { padding: 6px 16px 20px; display: flex; flex-direction: column; gap: 6px; }

    .item-wrap { border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: var(--card); transition: border-color 0.2s; opacity: 0; }
    .item-wrap:hover { border-color: var(--bh); }
    .item-wrap.expanded { border-color: var(--accent-border); }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .rise-in { animation: riseIn 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

    .item-card { display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer; user-select: none; }

    /* KONFIGURASI LAPISAN LOGO (ANTI-KEDIP) */
    .logo-wrap, .src-label-logo, .ex-search-item-logo {
      position: relative; /* Menahan elemen absolut di dalamnya */
      width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); overflow: hidden; flex-shrink: 0;
    }
    .src-label-logo { width: 20px; height: 20px; }
    .ex-search-item-logo { width: 26px; height: 26px; }

    .logo-initial {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--accent);
      z-index: 1; /* Lapis bawah */
    }
    .logo-img {
      position: relative; width: 100%; height: 100%; object-fit: cover;
      opacity: 0; /* Sengaja transparan dulu */
      transition: opacity 0.2s ease-in; /* Animasi mulus pas muncul */
      z-index: 10; /* Lapis atas nutupin tulisan inisial */
    }

    .item-info { flex: 1; min-width: 0; }
    .item-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .change-badge { font-family: var(--mono); font-size: 10px; padding: 2px 6px; border-radius: 5px; margin-left: 5px; }
    .change-badge.up { color: var(--green); background: rgba(34,211,160,0.1); }
    .change-badge.down { color: var(--red); background: rgba(240,93,110,0.1); }
    .item-val { text-align: right; flex-shrink: 0; }
    .item-val-main { font-family: var(--mono); font-size: 13px; font-weight: 700; }
    .item-val-sub { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 2px; }

    .item-detail { overflow: hidden; max-height: 0; transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.25s ease; opacity: 0; background: rgba(0,0,0,0.25); border-top: 0px solid var(--border); }
    .item-detail.open { max-height: 9999px; opacity: 1; border-top-width: 1px; }
    .detail-inner { padding: 10px 14px 12px; }
    .source-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .source-row:last-of-type { border-bottom: none; }
    .src-label { display: flex; align-items: center; gap: 6px; min-width: 80px; flex-shrink: 0; }
    .src-label-txt { font-size: 12px; font-weight: 600; color: var(--text); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 56px; }

    @media (max-width: 699px) {
      .source-row { flex-wrap: wrap; gap: 5px; }
      .src-label { min-width: unset; flex: 1; }
      .src-label-txt { max-width: 100%; font-size: 11px; }
      .src-estimate { font-size: 10px; min-width: unset; flex: none; }
      .src-del { margin-left: auto; }
      .src-inputs { width: 100%; flex: none; }
      .src-input { flex: 1; width: unset; min-width: 0; }
    }
    @media (min-width: 700px) {
      .src-label-txt { max-width: 120px; font-size: 13px; }
      .src-label { min-width: 100px; }
      .src-inputs { gap: 8px; }
      .src-input { width: 100px; }
      .src-estimate { min-width: 75px; font-size: 11px; }
    }

    .src-inputs { display: flex; gap: 5px; flex: 1; justify-content: flex-end; }
    .src-input { width: 90px; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 8px; font-family: var(--mono); font-size: 12px; outline: none; text-align: right; transition: border-color 0.2s; -moz-appearance: textfield; }
    .src-input::-webkit-inner-spin-button, .src-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .src-input:focus { border-color: var(--accent-border); }
    .src-input::placeholder { color: var(--muted); font-size: 11px; }
    .src-estimate { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: right; min-width: 60px; flex-shrink: 0; }
    .src-del { color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 4px; transition: color 0.2s; flex-shrink: 0; }
    .src-del:hover { color: var(--red); }
    .new-src-box { display: flex; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
    .new-src-btn { background: var(--accent-glow); border: 1px solid var(--accent-border); color: var(--accent); border-radius: 8px; padding: 0 14px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .new-src-btn:hover { background: rgba(124,106,247,0.3); }

    .bottom-bar { position: sticky; bottom: 0; z-index: 200; background: rgba(10,10,15,0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
    .add-row { display: flex; gap: 8px; }
    .add-main-btn { background: var(--accent); border: none; border-radius: 10px; color: #fff; font-family: var(--sans); font-weight: 700; font-size: 13px; padding: 0 18px; cursor: pointer; transition: opacity 0.2s; }
    .add-main-btn:active { opacity: 0.8; }
    .backup-row { display: flex; flex-wrap: wrap; gap: 5px; overflow: hidden; max-height: 160px; transition: max-height 0.3s ease, opacity 0.3s ease; opacity: 1; }
    .backup-row.hidden { max-height: 0; opacity: 0; }
    .bk-btn-sync-pair { flex: 1 1 100%; display: flex; gap: 5px; }
    .bk-btn-sync-pair .bk-btn-sync { flex: 1; }
    .bk-btn { flex: 1 1 calc(50% - 2.5px); background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-family: var(--sans); font-size: 11px; padding: 7px 6px; cursor: pointer; text-align: center; transition: border-color 0.2s, color 0.2s; white-space: nowrap; }
    .bk-btn:hover { border-color: var(--bh); color: var(--text); }
    .bk-btn-full { flex: 1 1 100% !important; border-color: var(--accent-border) !important; color: var(--accent) !important; }
    .bk-btn-danger { color: var(--red) !important; border-color: rgba(240,93,110,0.3) !important; }
    .bk-btn-sync { color: var(--green) !important; border-color: rgba(34,211,160,0.35) !important; background: rgba(34,211,160,0.06) !important; }
    .sync-status { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: center; min-height: 14px; width: 100%; transition: color 0.3s; padding: 2px 0; }
    .sync-status.ok { color: var(--green); }
    .sync-status.err { color: var(--red); }
    .sync-status.loading { color: var(--accent); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-box { width: 100%; max-width: 340px; background: var(--card2); border: 1px solid var(--accent-border); border-radius: 18px; padding: 22px 20px 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(124,106,247,0.1); transform: scale(0.92); transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1); }
    .modal-overlay.active .modal-box { transform: scale(1); }
    .modal-title { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); text-align: center; margin-bottom: 14px; }
    .modal-input { width: 100%; background: var(--surface); border: 1px solid var(--accent-border); color: var(--text); font-family: var(--mono); font-size: 14px; padding: 12px 14px; border-radius: 10px; outline: none; text-align: center; margin-bottom: 14px; }
    .modal-btns { display: flex; gap: 8px; }
    .modal-btn { flex: 1; padding: 11px 5px; border: none; border-radius: 10px; font-family: var(--sans); font-weight: 700; font-size: 12px; text-transform: uppercase; cursor: pointer; letter-spacing: 0.05em; }
    .mb-ok { background: var(--accent); color: #fff; }
    .mb-delete { background: rgba(240,93,110,0.2); border: 1px solid rgba(240,93,110,0.4); color: var(--red); }
    .mb-edit { background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--muted); }
    .mb-cancel { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--muted); }

    #toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(240,93,110,0.95); color: #fff; font-family: var(--sans); font-weight: 600; font-size: 12px; padding: 9px 20px; border-radius: 10px; z-index: 4000; opacity: 0; pointer-events: none; transition: all 0.3s; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (min-width: 700px) {
      :root { --sidebar-w: 420px; }
      .app-shell { flex-direction: row; min-height: 100vh; }
      .sidebar { width: var(--sidebar-w); flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px 22px; gap: 14px; }
      .sidebar::-webkit-scrollbar { width: 4px; }
      .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
      .sidebar-brand { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: 0.16em; padding-bottom: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
      .sidebar-brand span { color: var(--accent); }
      .sidebar-brand .kurs-badge { font-size: 10px; letter-spacing: 0.04em; padding: 5px 10px; }
      .sidebar-stats-label { font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; margin-bottom: -6px; }
      .sidebar .summary-card { flex-direction: column; align-items: flex-start; gap: 12px; padding: 20px 22px; margin: 0; border-radius: 18px; }
      .sidebar .summary-card .summary-right { width: 100%; flex-direction: row; justify-content: space-between; align-items: center; }
      .sidebar .summary-idr { font-size: 30px; }
      .sidebar .summary-usd { font-size: 13px; }
      .sidebar .summary-label { font-size: 10px; letter-spacing: 0.16em; }
      .sidebar-stats { display: flex; gap: 6px; }
      .stat-box { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 8px 9px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .stat-top-row { display: flex; align-items: center; gap: 5px; min-width: 0; }
      .stat-icon { width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
      .stat-icon img { width: 100%; height: 100%; object-fit: cover; }
      .stat-icon-txt { font-family: var(--mono); font-size: 7px; font-weight: 700; color: var(--accent); }
      .stat-sym { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
      .stat-price { font-family: var(--mono); font-size: 9px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
      .stat-chg { font-family: var(--mono); font-size: 10px; font-weight: 700; }
      .stat-chg.green { color: var(--green); }
      .stat-chg.red { color: var(--red); }
      .sidebar .kurs-badge { align-self: stretch; text-align: center; padding: 8px; font-size: 11px; }
      .sidebar .tab-row { margin-bottom: 0; }
      .sidebar .filter-input { margin-bottom: 0; width: 100%; min-width: 0; max-width: 100%; box-sizing: border-box; flex: none; display: block; padding: 10px 14px; font-size: 13px; }
      .sidebar .sort-row { flex-direction: column; gap: 8px; }
      .sidebar .ctrl-select { font-size: 12px; padding: 9px 12px; }
      .sidebar .backup-area { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
      .sidebar .sync-pair-desk { display: flex; gap: 6px; }
      .sidebar .sync-pair-desk .bk-btn-sync { flex: 1; padding: 9px 6px; }
      .sidebar .add-row { flex-direction: column; gap: 8px; }
      .sidebar .add-main-btn { padding: 11px; font-size: 14px; }
      .top-bar { display: none; }
      .summary-wrap { display: none; }
      .bottom-bar { display: none; }
      .main-content { flex: 1; overflow-y: auto; padding: 28px 28px 40px; background: var(--bg); }
      .main-content::-webkit-scrollbar { width: 5px; }
      .main-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 4px; }
      .desktop-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
      .desktop-header-title { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; }
      .desktop-header-count { font-family: var(--mono); font-size: 11px; color: var(--accent); background: var(--accent-glow); border: 1px solid var(--accent-border); border-radius: 6px; padding: 4px 10px; }
      .item-name { white-space: normal; overflow: visible; text-overflow: unset; }
      #main-list { padding: 0; max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 8px; }
    }
    @media (max-width: 699px) { .sidebar { display: none; } .main-content { width: 100%; } }

    .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); }
    .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state p { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; }

    .coin-search-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); z-index: 3500; align-items: center; justify-content: center; padding: 20px; }
    .coin-search-overlay.active { display: flex; }
    .coin-search-box { width: 100%; max-width: 420px; background: var(--card2); border: 1px solid var(--accent-border); border-radius: 20px; padding: 22px 20px 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(124,106,247,0.1); display: flex; flex-direction: column; gap: 12px; transform: scale(0.93); transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1); max-height: 80vh; }
    .coin-search-overlay.active .coin-search-box { transform: scale(1); }
    .coin-search-title { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); text-align: center; }
    .coin-search-input { width: 100%; background: var(--surface); border: 1px solid var(--accent-border); color: var(--text); font-family: var(--sans); font-size: 14px; padding: 11px 14px; border-radius: 12px; outline: none; }
    .coin-search-input::placeholder { color: var(--muted); }
    .coin-search-results { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; min-height: 0; max-height: 320px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .coin-search-item { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; transition: background 0.15s, border-color 0.15s; }
    .coin-search-item:hover { background: var(--surface); border-color: var(--border); }
    .coin-search-item.already { opacity: 0.4; pointer-events: none; }
    
    .coin-search-thumb { width: 28px; height: 28px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); object-fit: cover; flex-shrink: 0; }
    
    .coin-search-name { font-size: 13px; font-weight: 500; }
    .coin-search-sym { font-family: var(--mono); font-size: 11px; color: var(--muted); }
    .coin-search-cancel { width: 100%; background: none; border: 1px solid var(--border); border-radius: 12px; padding: 10px; color: var(--muted); cursor: pointer; font-family: var(--sans); font-size: 13px; transition: border-color 0.2s, color 0.2s; }
    .coin-search-cancel:hover { border-color: var(--bh); color: var(--text); }
    .coin-search-loading { text-align: center; padding: 20px; color: var(--muted); font-family: var(--mono); font-size: 12px; }

    .ex-search-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); z-index: 3500; align-items: center; justify-content: center; padding: 20px; }
    .ex-search-overlay.active { display: flex; }
    .ex-search-box { width: 100%; max-width: 380px; background: var(--card2); border: 1px solid var(--accent-border); border-radius: 20px; padding: 22px 20px 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 10px; transform: scale(0.93); transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1); }
    .ex-search-overlay.active .ex-search-box { transform: scale(1); }
    .ex-search-title { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); text-align: center; }
    .ex-search-input { width: 100%; background: var(--surface); border: 1px solid var(--accent-border); color: var(--text); font-family: var(--sans); font-size: 14px; padding: 11px 14px; border-radius: 12px; outline: none; text-transform: uppercase; }
    .ex-search-input::placeholder { color: var(--muted); font-size: 13px; text-transform: none; }
    .ex-search-results { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .ex-search-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; transition: background 0.15s, border-color 0.15s; }
    .ex-search-item:hover { background: var(--surface); border-color: var(--border); }
    .ex-search-item.new-entry { border-color: rgba(124,106,247,0.3); background: var(--accent-glow); color: var(--accent); }
    .ex-search-item-logo { width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
    .ex-search-item-logo img { width: 100%; height: 100%; object-fit: cover; }
    .ex-search-item-logo-txt { font-family: var(--mono); font-size: 8px; font-weight: 700; color: var(--accent); }
    .ex-search-item-name { font-size: 13px; font-weight: 600; }
    .ex-search-item-sub { font-size: 11px; color: var(--muted); }
    .ex-search-cancel { width: 100%; background: none; border: 1px solid var(--border); border-radius: 12px; padding: 10px; color: var(--muted); cursor: pointer; font-family: var(--sans); font-size: 13px; transition: border-color 0.2s, color 0.2s; }
    .ex-search-cancel:hover { border-color: var(--bh); color: var(--text); }
  </style>
</head>

<script>
let cgList = [];
let coinSearchTarget = null; 

function getLogoSrcs(sym) {
  const s = sym.toLowerCase();
  const cgId = coinMapCG[sym] || s;
  return [
    `https://gate.io/images/coin_icon/64/${s}.png`,
    `https://assets.coincap.io/assets/icons/${s}@2x.png`,
    `https://static.okx.com/cdn/oksupport/asset/currency/icon/${s}.png`,
    `https://assets.coingecko.com/coins/images/1/small/${cgId}.png`,
    `https://coinicons-api.vercel.app/api/icon/${s}`,
    `https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/32/color/${s}.png`
  ];
}

/* FUNGSI HANDLE LOGO - MENGGUNAKAN LAYER ANTI KEDIP */
function handleLogoError(img, sym) {
  if (sym === 'IDR') return;
  // Index dapet dari percobaan sebelumnya
  const retry = parseInt(img.getAttribute('data-retry') || '1');
  const sources = getLogoSrcs(sym);
  
  if (retry < sources.length) { 
    img.setAttribute('data-retry', retry + 1); 
    img.src = sources[retry]; 
  } else { 
    // Gagal total dari semua link cadangan
    // Buang img (layer atas) tanpa suara, biarkan layer bawah (tulisan inisial) yg kelihatan
    img.remove();
  }
}

function openCoinSearch(type, exchange) {
  coinSearchTarget = { type, exchange: exchange || null };
  const title = exchange ? `Tambah Koin ke ${exchange}` : 'Tambah Koin';
  document.getElementById('coin-search-title').innerText = title;
  document.getElementById('coin-search-input').value = '';
  document.getElementById('coin-search-overlay').classList.add('active');
  setTimeout(() => document.getElementById('coin-search-input').focus(), 150);
  cgList.length ? filterCoinSearch() : loadCGList();
}

function closeCoinSearch() {
  document.getElementById('coin-search-overlay').classList.remove('active');
  coinSearchTarget = null;
}

async function loadCGList() {
  try {
    const cached = localStorage.getItem('cg_coin_list');
    const cachedTs = parseInt(localStorage.getItem('cg_coin_list_ts') || '0');
    if (cached && Date.now() - cachedTs < 24 * 60 * 60 * 1000) {
      cgList = JSON.parse(cached);
      cgList.forEach(c => { coinMapCG[c.symbol.toUpperCase()] = c.id; });
      filterCoinSearch();
      return;
    }
  } catch(e) {}

  document.getElementById('coin-search-results').innerHTML = '<div class="coin-search-loading">Memuat daftar koin...</div>';
  try {
    const r = await fetch('https://api.coingecko.com/api/v3/coins/list?include_platform=false');
    cgList = await r.json();
    cgList.forEach(c => { coinMapCG[c.symbol.toUpperCase()] = c.id; });
    try {
      localStorage.setItem('cg_coin_list', JSON.stringify(cgList));
      localStorage.setItem('cg_coin_list_ts', Date.now().toString());
    } catch(e) {}
    filterCoinSearch();
  } catch {
    try {
      const cached = localStorage.getItem('cg_coin_list');
      if (cached) {
        cgList = JSON.parse(cached);
        cgList.forEach(c => { coinMapCG[c.symbol.toUpperCase()] = c.id; });
        filterCoinSearch();
        return;
      }
    } catch(e) {}
    document.getElementById('coin-search-results').innerHTML = '<div class="coin-search-loading" style="color:var(--red)">Gagal memuat. Cek koneksi.</div>';
  }
}

function filterCoinSearch() {
  const q = document.getElementById('coin-search-input').value.trim().toLowerCase();
  const box = document.getElementById('coin-search-results');
  if (!cgList.length) {
    if (q) {
      const qU = q.toUpperCase();
      box.innerHTML = `<div class="coin-search-item" onclick="pickCoinFromSearch('${q}','${qU}','${q}')">
        <div class="coin-search-thumb" style="background:var(--accent); display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px; font-weight:bold;">+</div>
        <div><div class="coin-search-name">Tambah Koin Kustom "${qU}"</div><div class="coin-search-sym">${qU}</div></div>
      </div>`;
    }
    return;
  }
  let hits = q ? cgList.filter(c => c.name.toLowerCase().includes(q) || c.symbol.toLowerCase().includes(q)) : cgList.slice(0, 60);
  if (q) {
    hits.sort((a, b) => {
      const rank = x => x === q ? 0 : x.startsWith(q) ? 1 : 2;
      const aR = Math.min(rank(a.symbol.toLowerCase()), rank(a.name.toLowerCase()) + 0.5);
      const bR = Math.min(rank(b.symbol.toLowerCase()), rank(b.name.toLowerCase()) + 0.5);
      return aR - bR;
    });
    hits = hits.slice(0, 60);
  }
  const targetEx = coinSearchTarget?.exchange;
  const alreadyInTarget = targetEx ? new Set(watchlist.filter(s => coinSources[s]?.includes(targetEx))) : new Set(watchlist);
  let html = hits.map(c => {
    const symU = c.symbol.toUpperCase();
    const isAdded = alreadyInTarget.has(symU);
    const src = getLogoSrcs(c.symbol)[0];
    const safeId   = c.id.replace(/'/g,"\\'");
    const safeName = c.name.replace(/'/g,"\\'");
    const safeSym  = c.symbol.replace(/'/g,"\\'");
    return `<div class="coin-search-item ${isAdded ? 'already' : ''}" onclick="${isAdded ? '' : `pickCoinFromSearch('${safeId}','${safeName}','${safeSym}')`}">
      <img class="coin-search-thumb" src="${src}" onerror="this.src='';this.style.background='var(--surface)'">
      <div><div class="coin-search-name">${c.name}</div><div class="coin-search-sym">${symU}${isAdded ? ' · sudah di exchange ini' : ''}</div></div>
    </div>`;
  }).join('');
  if (q) {
    const qU = q.toUpperCase();
    const isAddedCustom = alreadyInTarget.has(qU);
    html += `<div class="coin-search-item ${isAddedCustom ? 'already' : ''}" onclick="${isAddedCustom ? '' : `pickCoinFromSearch('${q}','${qU}','${q}')`}">
      <div class="coin-search-thumb" style="background:var(--accent-border); display:flex; align-items:center; justify-content:center; color:var(--text); font-size:12px; font-weight:bold;">+</div>
      <div><div class="coin-search-name">Buat Koin Kustom "${qU}"</div><div class="coin-search-sym">${qU}${isAddedCustom ? ' · sudah ada' : ''}</div></div>
    </div>`;
  }
  box.innerHTML = (!hits.length && !q) ? '<div class="coin-search-loading">Tidak ditemukan.</div>' : html;
}

function pickCoinFromSearch(id, name, sym) {
  const symU = sym.toUpperCase();
  const target = coinSearchTarget;
  closeCoinSearch();
  if (!watchlist.includes(symU)) { watchlist.push(symU); coinSources[symU] = []; coinMapCG[symU] = id; }
  if (target?.type === 'exchange' && target.exchange) {
    const ex = target.exchange;
    if (!coinSources[symU].includes(ex)) coinSources[symU].push(ex);
    if (!allExchanges.includes(ex)) allExchanges.push(ex);
    expandedItem = ex;
  }
  saveAll(); renderList(); fetchAll();
}

let exSearchTarget = null;
function openExSearch(sym) {
  exSearchTarget = sym;
  document.getElementById('ex-search-input').value = '';
  filterExSearch();
  document.getElementById('ex-search-overlay').classList.add('active');
  setTimeout(() => document.getElementById('ex-search-input').focus(), 150);
}
function closeExSearch() { document.getElementById('ex-search-overlay').classList.remove('active'); exSearchTarget = null; }
function filterExSearch() {
  const q = document.getElementById('ex-search-input').value.trim().toUpperCase();
  const box = document.getElementById('ex-search-results');
  const sym = exSearchTarget;
  const alreadySource = new Set(coinSources[sym] || []);
  const matched = allExchanges.filter(ex => !alreadySource.has(ex) && (q === '' || ex.includes(q)));
  let html = matched.map(ex => {
    const brand = ex.split(' ')[0];
    const logo = exchangeLogos[brand] || '';
    return `<div class="ex-search-item" onclick="pickExFromSearch('${ex}')">
      <div class="ex-search-item-logo">${logo ? `<img src="${logo}" onerror="this.parentElement.innerHTML='<span class=ex-search-item-logo-txt>${brand.substring(0,2)}</span>'">` : `<span class="ex-search-item-logo-txt">${brand.substring(0,2)}</span>`}</div>
      <div><div class="ex-search-item-name">${ex}</div></div>
    </div>`;
  }).join('');
  if (q && !allExchanges.includes(q) && !alreadySource.has(q)) {
    html += `<div class="ex-search-item new-entry" onclick="pickExFromSearch('${q}')">
      <div class="ex-search-item-logo"><span class="ex-search-item-logo-txt">+</span></div>
      <div><div class="ex-search-item-name">Buat baru: "${q}"</div><div class="ex-search-item-sub">Exchange baru akan ditambahkan</div></div>
    </div>`;
  }
  box.innerHTML = html || `<div style="text-align:center;padding:16px;color:var(--muted);font-family:var(--mono);font-size:11px">Ketik nama exchange...</div>`;
}
function pickExFromSearch(ex) {
  const sym = exSearchTarget; closeExSearch(); if (!sym) return;
  const exU = ex.toUpperCase();
  if (!allExchanges.includes(exU)) allExchanges.push(exU);
  if (!coinSources[sym]) coinSources[sym] = [];
  if (!coinSources[sym].includes(exU)) coinSources[sym].push(exU);
  saveAll(); renderList();
}

const SYNC_URL = 'https://script.google.com/macros/s/AKfycby2sWFj_-Altg7u7OcxWT-CxdMJzJhzJlOvhIK3QDt00dGUpklVrgZPXB-BZxAdmFKMjA/exec';
const SYNC_PIN = 'SATRIA';

function setSyncStatus(msg, type) { ['sync-status-desk','sync-status-mob'].forEach(id => { const el = document.getElementById(id); if (!el) return; el.innerText = msg; el.className = 'sync-status ' + (type || ''); }); }
function syncPushWithPin() {
  const overlay = document.getElementById('modal-overlay'); const inp = document.getElementById('modal-input');
  document.getElementById('modal-title').innerText = '🔐 MASUKKAN SANDI'; inp.style.display = 'block'; inp.type = 'password'; inp.value = ''; inp.placeholder = 'Sandi...';
  document.getElementById('modal-btns').innerHTML = `<button class="modal-btn mb-ok" id="btn-pin-ok">SIMPAN</button><button class="modal-btn mb-cancel" onclick="closeModal();document.getElementById('modal-input').type='text'">BATAL</button>`;
  document.getElementById('btn-pin-ok').onclick = () => {
    if (inp.value.toUpperCase() === SYNC_PIN) { inp.type = 'text'; closeModal(); syncPush(); }
    else { inp.value = ''; inp.placeholder = '❌ Sandi salah, coba lagi'; inp.style.borderColor = 'var(--red)'; setTimeout(() => { inp.style.borderColor = ''; inp.placeholder = 'Sandi...'; }, 1500); }
  };
  inp.onkeypress = (e) => { if (e.key === 'Enter') document.getElementById('btn-pin-ok')?.click(); };
  overlay.classList.add('active'); setTimeout(() => inp.focus(), 200);
}

function syncPullWithConfirm() {
  const overlay = document.getElementById('modal-overlay'); const inp = document.getElementById('modal-input');
  document.getElementById('modal-title').innerText = '⚠️ AMBIL DATA DARI CLOUD?'; inp.style.display = 'none';
  document.getElementById('modal-btns').innerHTML = `<div style="width:100%;text-align:center;font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.5">Data lokal akan diganti dengan data dari cloud.<br>Pastikan data cloud sudah tersimpan dengan benar.</div><button class="modal-btn mb-ok" id="btn-pull-ok">AMBIL</button><button class="modal-btn mb-cancel" onclick="closeModal()">BATAL</button>`;
  document.getElementById('btn-pull-ok').onclick = () => { closeModal(); syncPull(); }; overlay.classList.add('active');
}

async function syncPush() {
  setSyncStatus('⏳ Menyimpan...', 'loading'); document.querySelectorAll('.bk-btn-sync').forEach(b => b.disabled = true);
  try {
    const payload = { assets: watchlist, balances, sources: coinSources, exchanges: allExchanges };
    const res = await fetch(SYNC_URL, { method: 'POST', body: JSON.stringify(payload) }); const json = await res.json();
    if (json.status === 'ok') { const t = new Date().toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'}); setSyncStatus('✅ Tersimpan ' + t, 'ok'); showToast('✅ Data berhasil disimpan ke cloud!'); }
    else throw new Error(json.message || 'Error');
  } catch (err) { setSyncStatus('❌ Gagal simpan', 'err'); showToast('❌ Gagal simpan ke cloud!'); }
  document.querySelectorAll('.bk-btn-sync').forEach(b => b.disabled = false);
}

async function syncPull() {
  setSyncStatus('⏳ Mengambil...', 'loading'); document.querySelectorAll('.bk-btn-sync').forEach(b => b.disabled = true);
  try {
    const res = await fetch(SYNC_URL + '?t=' + Date.now()); const json = await res.json();
    if (json.status === 'ok' && json.data) {
      const d = json.data; watchlist = d.assets || []; balances = d.balances || {}; coinSources = d.sources || {}; allExchanges= d.exchanges || [];
      migrateToUppercase(); saveAll(); renderList(); fetchAll(); setSyncStatus('✅ Diperbarui ' + (json.lastUpdate || ''), 'ok'); showToast('✅ Data berhasil diambil dari cloud!');
    } else if (json.status === 'empty') { setSyncStatus('⚠️ Cloud masih kosong', 'err'); showToast('⚠️ Belum ada data di cloud. Simpan dulu!'); }
    else throw new Error(json.message || 'Error');

function migrateToUppercase() {
  let dirty = false;
  watchlist = watchlist.map(s => { if(s !== s.toUpperCase()) dirty = true; return s.toUpperCase(); });
  allExchanges = allExchanges.map(ex => { if(ex !== ex.toUpperCase()) dirty = true; return ex.toUpperCase(); });
  let newCS = {}, newBal = {};
  for (let c in coinSources) {
    let uc = c.toUpperCase(); if(c !== uc) dirty = true;
    newCS[uc] = (coinSources[c] || []).map(s => { if(s !== s.toUpperCase()) dirty = true; return s.toUpperCase(); });
  }
  for (let c in balances) {
    let uc = c.toUpperCase(); newBal[uc] = {};
    for (let s in balances[c]) { let us = s.toUpperCase(); newBal[uc][us] = (typeof balances[c][s] === 'object') ? balances[c][s] : { amount: balances[c][s], staking: '' }; }
  }
  coinSources = newCS; balances = newBal; if(dirty) saveAll();
}

async function fetchAll() {
  if(isFetching) return; isFetching = true;
  let rem = watchlist.filter(s => !['IDR','USDT','USDC','USD','BUSD'].includes(s));
  try {
    const res = await fetch('https://api.bybit.com/v5/market/tickers?category=spot'); const data = await res.json();
    if(data.result?.list) { data.result.list.forEach(item => { let sym = item.symbol.replace('USDT',''); if(rem.includes(sym)) { prices[sym] = parseFloat(item.lastPrice); changes[sym] = (parseFloat(item.price24hPcnt)*100).toFixed(2); rem = rem.filter(c => c !== sym); } }); }
  } catch(e) {}
  if(rem.length > 0) {
    try {
      const res = await fetch('https://api.binance.com/api/v3/ticker/24hr'); const data = await res.json();
      data.forEach(item => { let sym = item.symbol.replace('USDT',''); if(rem.includes(sym)) { prices[sym] = parseFloat(item.lastPrice); changes[sym] = parseFloat(item.priceChangePercent).toFixed(2); rem = rem.filter(c => c !== sym); } });
    } catch(e) {}
  }
  if (rem.length > 0) {
    const cgIds = rem.filter(s => coinMapCG[s]).map(s => coinMapCG[s]);
    if (cgIds.length > 0) {
      try {
        const r = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${cgIds.join(',')}&vs_currencies=usd&include_24hr_change=true`); const d = await r.json();
        rem = rem.filter(s => { const id = coinMapCG[s]; if (id && d[id]) { prices[s] = d[id].usd; changes[s] = d[id].usd_24h_change ? d[id].usd_24h_change.toFixed(2) : '0.00'; return false; } return true; });
      } catch(e) {}
    }
  }
  watchlist.forEach(s => {
    if(s === 'IDR') { prices[s] = 1/usdToIdr; changes[s] = '0.00'; }
    else if(['USDT','USDC','USD','BUSD'].includes(s)) { prices[s] = 1; changes[s] = '0.00'; }
    else if(!prices[s]) { prices[s] = 0; changes[s] = '0.00'; }
  });
  updatePricesOnly(); isFetching = false;
}

            <div class="src-inputs"><input type="number" class="src-input" inputmode="decimal" value="${d.amount||''}" oninput="updateBal('${s}','${ex.name}','amount',this.value)" placeholder="Amount"><input type="number" class="src-input" inputmode="decimal" value="${d.staking||''}" oninput="updateBal('${s}','${ex.name}','staking',this.value)" placeholder="Stake"></div>
            <span class="src-estimate" id="est-${ex.name}-${s}">${estStr}</span><span class="src-del" onclick="confirmModal('Hapus ${s}?','delete',()=>removeCoinFromExchange('${s}','${ex.name}'))">×</span>
          </div>`;
      }).join('');
      
      html += `
        <div class="item-wrap rise-in${isOpen?' expanded':''}" id="wrap-${ex.name}" style="animation-delay: ${idx * 30}ms">
          <div class="item-card" onclick="toggleDetail('${ex.name}')" onmousedown="startHold(event,'${ex.name}','exchange')" onmousemove="moveHold(event)" onmouseup="clearHold()" ontouchstart="startHold(event,'${ex.name}','exchange')" ontouchmove="moveHold(event)" ontouchend="clearHold()">
            <div class="logo-wrap">${exLogoHtml}</div>
            <div class="item-info"><div class="item-name">${brand}${suffix ? `<span style="font-size:11px;font-weight:400;color:var(--muted)"> ${suffix}</span>` : ''}</div><div class="item-sub">${subKoin.length} koin</div></div>
            <div class="item-val"><div class="item-val-main" id="val-ex-${ex.name}">-</div></div>
          </div>
          <div class="item-detail${isOpen?' open':''}" id="det-${ex.name}">
            <div class="detail-inner">${coinRows}<div class="new-src-box"><button class="new-src-btn" style="flex:1;padding:9px 14px;font-size:13px;font-family:var(--sans);font-weight:600" onclick="openCoinSearch('exchange','${ex.name}')">+ Tambah Koin ke ${brand}</button></div></div>
          </div>
        </div>`;
    });
  } else {
    let filtered = watchlist.filter(s => s.includes(query));
    if(sortType === 'name') filtered.sort((a,b) => a.localeCompare(b));
    else if(sortType === 'value') filtered.sort((a,b) => (getCoinTotal(b)*(prices[b]||0)) - (getCoinTotal(a)*(prices[a]||0)));
    else if(sortType === 'gainers') filtered.sort((a,b) => parseFloat(changes[b]||-999) - parseFloat(changes[a]||-999));
    
    if(filtered.length === 0) html = `<div class="empty-state"><div class="empty-icon">🪙</div><p>Belum ada koin.<br>Tambah di bawah.</p></div>`;
    
    filtered.forEach((s, idx) => {
      const subSrc = [...(coinSources[s]||[])]; const isOpen = expandedItem === s; const p = prices[s] || 0; const c = changes[s] || '0.00';
      const srcRows = subSrc.map(src => {
        const d = (balances[s] && balances[s][src]) ? balances[s][src] : { amount: '', staking: '' };
        const amt = (typeof d === 'object') ? parseFloat(d.amount||0) : parseFloat(d||0); const stk = (typeof d === 'object') ? parseFloat(d.staking||0) : 0;
        const usdEst = (amt + stk) * p; const estStr = (amt + stk) > 0 ? `~${fmtUSD(usdEst)}` : '';
        
        // Layer trik utk source icon di tab koin
        const srcPrefix = src.split(' ')[0]; const srcLogo = exchangeLogos[srcPrefix] || exchangeLogos[src] || '';
        const exInitial = srcPrefix.substring(0,2);
        const exLogoHtml = `<div class="logo-initial" style="font-size:8px">${exInitial}</div>${srcLogo ? `<img class="logo-img" src="${srcLogo}" onload="this.style.opacity='1'" onerror="this.remove()">` : ''}`;

        return `
          <div class="source-row">
            <div class="src-label"><div class="src-label-logo">${exLogoHtml}</div><span class="src-label-txt">${src}</span></div>
            <div class="src-inputs"><input type="number" class="src-input" inputmode="decimal" value="${d.amount||''}" oninput="updateBal('${s}','${src}','amount',this.value)" placeholder="Amount"><input type="number" class="src-input" inputmode="decimal" value="${d.staking||''}" oninput="updateBal('${s}','${src}','staking',this.value)" placeholder="Stake"></div>
            <span class="src-estimate" id="est-coin-${s}-${src}">${estStr}</span><span class="src-del" onclick="confirmModal('Hapus ${src}?','delete',()=>removeSource('${s}','${src}'))">×</span>
          </div>`;
      }).join('');
      
      // Layer trik utk logo utama di tab koin
      const firstUrl = getLogoSrcs(s)[0];
      const initialTxt = s.substring(0,2);
      const mainLogoHtml = s === 'IDR' ? `<div class="logo-initial" style="color:#22d3a0">RP</div>` : `<div class="logo-initial">${initialTxt}</div><img class="logo-img" src="${firstUrl}" data-retry="1" onload="this.style.opacity='1'" onerror="handleLogoError(this,'${s}')">`;
      
      html += `
        <div class="item-wrap rise-in${isOpen?' expanded':''}" id="wrap-${s}" style="animation-delay: ${idx * 30}ms">
          <div class="item-card" onclick="toggleDetail('${s}')" onmousedown="startHold(event,'${s}','coin')" onmousemove="moveHold(event)" onmouseup="clearHold()" ontouchstart="startHold(event,'${s}','coin')" ontouchmove="moveHold(event)" ontouchend="clearHold()">
            <div class="logo-wrap">${mainLogoHtml}</div>
            <div class="item-info"><div class="item-name">${s}<span id="change-coin-${s}" class="change-badge ${parseFloat(c)>=0?'up':'down'}">${parseFloat(c)>=0?'+':''}${c}%</span></div><div class="item-sub" id="price-coin-${s}">${p ? '$'+p.toLocaleString(undefined,{minimumFractionDigits:p<1?4:2}) : '...'}</div></div>
            <div class="item-val"><div class="item-val-main" style="font-size:12px">${getCoinTotal(s).toLocaleString()}</div><div class="item-val-sub" id="val-coin-${s}">-</div></div>
          </div>
          <div class="item-detail${isOpen?' open':''}" id="det-${s}">
            <div class="detail-inner">${srcRows}<div class="new-src-box"><button class="new-src-btn" style="flex:1;padding:9px 14px;font-size:13px;font-family:var(--sans);font-weight:600" onclick="openExSearch('${s}')">+ Tambah ke Exchange</button></div></div>
          </div>
        </div>`;
    });
  }
  list.innerHTML = html; updatePricesOnly();
  list.querySelectorAll('input[type=number]').forEach(inp => { inp.addEventListener('wheel', e => e.preventDefault(), { passive: false }); });
}

function switchTab(tab) {
  currentTab = tab;
  ['tab-ex','tab-ex-d'].forEach(id => { const el = document.getElementById(id); if(el) el.classList.toggle('active', tab==='exchange'); });
  ['tab-coin','tab-coin-d'].forEach(id => { const el = document.getElementById(id); if(el) el.classList.toggle('active', tab==='coin'); });
  expandedItem = null; const label = tab === 'exchange' ? '+ Tambah Exchange' : '+ Tambah Coin';
  ['global-add-btn-desk','global-add-btn-mob'].forEach(id => { const el = document.getElementById(id); if(el) el.innerText = label; }); renderList();
}
function updateSettings(src) {
  if(src === 'mob') {
    const sortVal = document.getElementById('sort-order')?.value; const curVal = document.getElementById('currency-view')?.value;
    if(sortVal) { localStorage.setItem('last_sort', sortVal); const d = document.getElementById('sort-order-desk'); if(d) d.value = sortVal; }
    if(curVal) { localStorage.setItem('last_cur', curVal); const d = document.getElementById('currency-view-desk'); if(d) d.value = curVal; }
  } else {
    const sortVal = document.getElementById('sort-order-desk')?.value; const curVal = document.getElementById('currency-view-desk')?.value;
    if(sortVal) { localStorage.setItem('last_sort', sortVal); const d = document.getElementById('sort-order'); if(d) d.value = sortVal; }
    if(curVal) { localStorage.setItem('last_cur', curVal); const d = document.getElementById('currency-view'); if(d) d.value = curVal; }
  }
  renderList();
}
function handleGlobalAdd() {
  if (currentTab === 'coin') { openCoinSearch('global'); return; }
  const overlay = document.getElementById('modal-overlay'); const inp = document.getElementById('modal-input');
  document.getElementById('modal-title').innerText = '+ TAMBAH EXCHANGE'; inp.style.display = 'block'; inp.type = 'text'; inp.value = ''; inp.placeholder = 'Nama Exchange...'; inp.style.textTransform = 'uppercase';
  document.getElementById('modal-btns').innerHTML = `<button class="modal-btn mb-ok" id="btn-addex-ok">TAMBAH</button><button class="modal-btn mb-cancel" onclick="closeModal();document.getElementById('modal-input').style.textTransform=''">BATAL</button>`;
  document.getElementById('btn-addex-ok').onclick = () => { const v = inp.value.trim().toUpperCase(); inp.style.textTransform = ''; if (!v) return; closeModal(); if (!allExchanges.includes(v)) { allExchanges.push(v); saveAll(); renderList(); } else showToast(`Exchange ${v} sudah ada!`); };
  inp.onkeypress = e => { if (e.key === 'Enter') document.getElementById('btn-addex-ok')?.click(); }; overlay.classList.add('active'); setTimeout(() => inp.focus(), 200);
}
function updateBal(s, src, type, v) { if(!balances[s]) balances[s] = {}; if(!balances[s][src] || typeof balances[s][src] !== 'object') balances[s][src] = { amount: 0, staking: '' }; balances[s][src][type] = v; saveAll(); updatePricesOnly(); }
function removeCoinFromExchange(s, ex) { coinSources[s] = coinSources[s].filter(i => i !== ex); saveAll(); renderList(); }
function removeSource(s, src) { coinSources[s] = coinSources[s].filter(i => i !== src); saveAll(); renderList(); }
function resetApp() { localStorage.clear(); watchlist = []; balances = {}; coinSources = {}; allExchanges = []; prices = {}; changes = {}; expandedItem = null; renderList(); updatePricesOnly(); showToast('Data direset!'); }
function openFilePicker(mode) { currentMode = mode; document.getElementById('importFile').value = ''; document.getElementById('importFile').click(); }
function exportData(fileName) { const data = { assets: watchlist, balances: balances, sources: coinSources, exchanges: allExchanges }; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' })); a.download = `${fileName.toUpperCase().trim()}.json`; a.click(); }
function handleFileSelect(event) {
  const file = event.target.files[0]; if(!file) return; const reader = new FileReader();
  reader.onload = (f) => {
    try {
      let d = JSON.parse(f.target.result);
      if(currentMode === 'restore') { watchlist = d.assets || []; balances = d.balances || {}; coinSources = d.sources || {}; allExchanges = d.exchanges || []; }
      else {
        (d.assets || []).forEach(s => { if(!watchlist.includes(s)) watchlist.push(s); }); (d.exchanges || []).forEach(ex => { if(!allExchanges.includes(ex)) allExchanges.push(ex); });
        for(let s in d.sources) { if(!coinSources[s]) coinSources[s]=[]; d.sources[s].forEach(src => { if(!coinSources[s].includes(src)) coinSources[s].push(src); }); }
        for(let s in d.balances) { if(!balances[s]) balances[s]={}; for(let src in d.balances[s]) { balances[s][src] = d.balances[s][src]; } }
      }
      migrateToUppercase(); saveAll(); fetchKurs(); renderList(); updatePricesOnly(); fetchAll(); showToast('Berhasil!');
    } catch(err) { showToast('Gagal import!'); }
  };
  reader.readAsText(file);
}
function exportToExcel(fileName) {
  let csv = 'sep=,\nExchange,Koin,Amount,Staking,Harga USD,Total USD\n';
  allExchanges.forEach(ex => {
    watchlist.forEach(s => {
      if(coinSources[s]?.includes(ex)) {
        const d = balances[s]?.[ex]; let am = (typeof d === 'object') ? parseFloat(d.amount||0) : parseFloat(d||0); let st = (typeof d === 'object') ? parseFloat(d.staking||0) : 0;
        if(am+st > 0) csv += `${ex},${s},${am},${st},${prices[s]||0},${((am+st)*(prices[s]||0)).toFixed(2)}\n`;
      }
    });
  });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `${fileName.toUpperCase().trim()}.csv`; a.click(); showToast('CSV Berhasil Disimpan!');
}
function renameProcess(oldVal, newVal, type) {
  if(newVal && newVal.trim() !== '' && newVal.toUpperCase() !== oldVal) {
    const upper = newVal.toUpperCase().trim();
    if(type === 'exchange') {
      allExchanges = allExchanges.map(ex => ex === oldVal ? upper : ex);
      for(let c in coinSources) coinSources[c] = coinSources[c].map(src => src === oldVal ? upper : src);
      for(let c in balances) { if(balances[c][oldVal]) { balances[c][upper] = balances[c][oldVal]; delete balances[c][oldVal]; } }
    } else {
      watchlist = watchlist.map(s => s === oldVal ? upper : s);
      if(coinSources[oldVal]) { coinSources[upper] = coinSources[oldVal]; delete coinSources[oldVal]; }
      if(balances[oldVal]) { balances[upper] = balances[oldVal]; delete balances[oldVal]; }
    }
    saveAll(); renderList();
  }
}
function startHold(event, id, type) {
  const touch = event.touches ? event.touches[0] : event; startX = touch.clientX; startY = touch.clientY;
  holdTimer = setTimeout(() => {
    if(type === 'exchange') confirmModal(`HAPUS ${id}?`, 'delete', () => { allExchanges = allExchanges.filter(ex => ex !== id); saveAll(); renderList(); }, () => renamePopup(id, 'exchange'));
    else confirmModal(`HAPUS ${id}?`, 'delete', () => { watchlist = watchlist.filter(s => s !== id); delete balances[id]; delete coinSources[id]; saveAll(); renderList(); }, () => renamePopup(id, 'coin'));
  }, 700);
}
function moveHold(event) { if(!holdTimer) return; const touch = event.touches ? event.touches[0] : event; if(Math.abs(touch.clientX-startX)>15 || Math.abs(touch.clientY-startY)>15) clearHold(); }
function clearHold() { clearTimeout(holdTimer); holdTimer = null; }
</script>
</body>
